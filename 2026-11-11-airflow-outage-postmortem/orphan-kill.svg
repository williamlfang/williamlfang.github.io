<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 470' width='920' height='470'><rect width='920' height='470' fill='#ffffff'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><text x='28' y='38' font-size='22' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Why re-adopting 43 trades killed them five minutes later</text><rect x='35' y='62' width='190' height='48' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='1.5'/><text x='130' y='83' font-size='14' fill='#1f2937' font-weight='700' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>old scheduler</text><text x='130' y='101' font-size='11.5' fill='#6b7280' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>job 653471 (dead)</text><line x1='130' y1='112' x2='130' y2='452' stroke='#d1d5db' stroke-dasharray='4 4'/><rect x='245' y='62' width='190' height='48' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='1.5'/><text x='340' y='83' font-size='14' fill='#1f2937' font-weight='700' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>new scheduler</text><text x='340' y='101' font-size='11.5' fill='#6b7280' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>job 653513</text><line x1='340' y1='112' x2='340' y2='452' stroke='#d1d5db' stroke-dasharray='4 4'/><rect x='465' y='62' width='190' height='48' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='1.5'/><text x='560' y='83' font-size='14' fill='#1f2937' font-weight='700' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>attempt N (mine)</text><text x='560' y='101' font-size='11.5' fill='#6b7280' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>airflow tasks run --local</text><line x1='560' y1='112' x2='560' y2='452' stroke='#d1d5db' stroke-dasharray='4 4'/><rect x='695' y='62' width='190' height='48' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='1.5'/><text x='790' y='83' font-size='14' fill='#1f2937' font-weight='700' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>trade container</text><text x='790' y='101' font-size='11.5' fill='#6b7280' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>task_live_trade_…</text><line x1='790' y1='112' x2='790' y2='452' stroke='#d1d5db' stroke-dasharray='4 4'/><text x='130' y='150' font-size='12' fill='#6b7280' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>TI.queued_by_job_id</text><text x='130' y='166' font-size='12' fill='#be185d' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>still = 653471</text><line x1='560' y1='196' x2='782' y2='196' stroke='#15803d' stroke-width='1.6' marker-end='url(#ah)'/><text x='675.0' y='189' font-size='12.5' fill='#15803d' font-weight='400' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>stop old container, start fresh one</text><text x='24' y='200' font-size='12' fill='#6b7280' font-weight='400' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace'>10:01</text><rect x='222' y='222' width='236' height='40' rx='6' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='340' y='247' font-size='12' fill='#c2410c' font-weight='400' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace'>adopt_or_reset_orphaned_tasks</text><text x='24' y='246' font-size='12' fill='#6b7280' font-weight='400' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace'>10:03:25</text><text x='340' y='282' font-size='12.5' fill='#c2410c' font-weight='400' text-anchor='middle' font-family='Inter,Helvetica,Arial,sans-serif'>queued_by job is dead → reset 43 TIs, queue attempt N+1</text><line x1='34