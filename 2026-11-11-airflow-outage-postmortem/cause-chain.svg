<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 520' width='920' height='520'><rect width='920' height='520' fill='#ffffff'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><text x='28' y='38' font-size='22' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>How one failed disk turned into five incidents</text><rect x='330' y='66' width='260' height='54' rx='8' fill='#f9fafb' stroke='#b91c1c' stroke-width='1.5'/><rect x='330' y='66' width='6' height='54' rx='3' fill='#b91c1c'/><text x='348' y='89' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Disk sdb fails (I/O errors)</text><text x='348' y='109' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Nov 10 19:56</text><rect x='300' y='156' width='320' height='54' rx='8' fill='#f9fafb' stroke='#b91c1c' stroke-width='1.5'/><rect x='300' y='156' width='6' height='54' rx='3' fill='#b91c1c'/><text x='318' y='179' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Docker switched to an empty data-root</text><text x='318' y='199' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>old /var/lib/docker unreachable</text><rect x='40' y='256' width='360' height='54' rx='8' fill='#f9fafb' stroke='#b91c1c' stroke-width='1.5'/><rect x='40' y='256' width='6' height='54' rx='3' fill='#b91c1c'/><text x='58' y='279' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Every old container + image invisible</text><text x='58' y='299' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>rabbitmq, other compose services</text><rect x='520' y='256' width='360' height='54' rx='8' fill='#f9fafb' stroke='#c2410c' stroke-width='1.5'/><rect x='520' y='256' width='6' height='54' rx='3' fill='#c2410c'/><text x='538' y='279' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Airflow rebuilt by hand, from memory</text><text x='538' y='299' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>image layer airflow.cfg lost</text><rect x='40' y='356' width='250' height='54' rx='8' fill='#f9fafb' stroke='#7c3aed' stroke-width='1.5'/><rect x='40' y='356' width='6' height='54' rx='3' fill='#7c3aed'/><text x='58' y='379' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>RabbitMQ gone</text><text x='58' y='399' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>clients can’t connect</text><rect x='330' y='356' width='250' height='54' rx='8' fill='#f9fafb' stroke='#7c3aed' stroke-width='1.5'/><rect x='330' y='356' width='6' height='54' rx='3' fill='#7c3aed'/><text x='348' y='379' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>No /data mount</text><text x='348' y='399' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>yaml relink + checks fail</text><rect x='620' y='356' width='260' height='54' rx='8' fill='#f9fafb' stroke='#7c3aed' stroke-width='1.5'/><rect x='620' y='356' width='6' height='54' rx='3' fill='#7c3aed'/><text x='638' y='379' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Default limits 16 / 32</text><text x='638' y='399' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>18 of 34 live trades queued</text><rect x='330' y='446' width='550' height='54' rx='8' fill='#f9fafb' stroke='#7c3aed' stroke-width='1.5'/><rect x='330' y='446' width='6' height='54' rx='3' fill='#7c3aed'/><text x='348' y='469' font-size='15' fill='#1f2937' font-weight='600' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Restarts orphan long-running trade tasks</text><text x='348' y='489' font-size='12.5' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>stale 00:25 containers, 09:54 restart, 10:03 reset</text><line x1='460' y1='120' x2='460' y2='154' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='400' y1='210' x2='250' y2='254' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='520' y1='210' x2='680' y2='254' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='200' y1='310' x2='170' y2='354' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='620' y1='310' x2='470' y2='354' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='720' y1='310' x2='750' y2='354' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/><line x1='850' y1='310' x2='820' y2='444' stroke='#6b7280' stroke-width='1.6' marker-end='url(#ah)'/></svg>