<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 470' width='920' height='470'><rect width='920' height='470' fill='#ffffff'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><text x='28' y='38' font-size='22' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Proposed: Airflow orchestrates, it doesn’t babysit</text><rect x='28' y='62' width='410' height='380' rx='8' fill='#fef2f2' stroke='#b91c1c' stroke-width='1.5' stroke-dasharray='6 4'/><text x='48' y='90' font-size='16' fill='#b91c1c' font-weight='700' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Today</text><circle cx='56' cy='124' r='4' fill='#b91c1c'/><text x='70' y='129' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>config: hand-typed docker run, airflow.cfg in image layer</text><circle cx='56' cy='168' r='4' fill='#b91c1c'/><text x='70' y='173' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>state: rabbitmq data in container layer</text><circle cx='56' cy='212' r='4' fill='#b91c1c'/><text x='70' y='217' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>trading process = Airflow task, holds a slot ~5.5 h</text><circle cx='56' cy='256' r='4' fill='#b91c1c'/><text x='70' y='261' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>task runner = child of the scheduler (LocalExecutor)</text><circle cx='56' cy='300' r='4' fill='#b91c1c'/><text x='70' y='305' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>restart → orphan → duplicate guard fails the task</text><circle cx='56' cy='344' r='4' fill='#b91c1c'/><text x='70' y='349' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>manual run at 00:19 can start live trading</text><circle cx='56' cy='388' r='4' fill='#b91c1c'/><text x='70' y='393' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>anyone can restart the container mid-session</text><rect x='482' y='62' width='410' height='380' rx='8' fill='#f0fdf4' stroke='#15803d' stroke-width='1.5'/><text x='502' y='90' font-size='16' fill='#15803d' font-weight='700' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Proposed</text><circle cx='510' cy='124' r='4' fill='#15803d'/><text x='524' y='129' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>config: one compose file in git, CI diffs it vs. live</text><circle cx='510' cy='168' r='4' fill='#15803d'/><text x='524' y='173' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>state: named volumes + rabbitmq definitions.json</text><circle cx='510' cy='212' r='4' fill='#15803d'/><text x='524' y='217' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>trader = long-lived service (systemd / compose)</text><circle cx='510' cy='256' r='4' fill='#15803d'/><text x='524' y='261' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>Airflow: start → sensor in reschedule mode, no held slot</text><circle cx='510' cy='300' r='4' fill='#15803d'/><text x='524' y='305' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>operator adopts its own container via labels</text><circle cx='510' cy='344' r='4' fill='#15803d'/><text x='524' y='349' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>live-trade tasks refuse non-scheduled runs off-hours</text><circle cx='510' cy='388' r='4' fill='#15803d'/><text x='524' y='393' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Inter,Helvetica,Arial,sans-serif'>restart freeze 09:00–15:00 + a pre-restart script</text><line x1='442' y1='252' x2='478' y2='252' stroke='#15803d' stroke-width='1.6' marker-end='url(#ah)'/></svg>